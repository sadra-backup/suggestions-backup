<!-- THEME INITIALIZATION -->
<script>
(function () {
  try {
    const savedTheme = localStorage.getItem('sadra-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : prefersDark ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
  } catch (error) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'sadra-theme';
  var root = document.documentElement;
  function isValidTheme(t) { return t === 'light' || t === 'dark'; }
  function currentTheme() { var t = root.getAttribute('data-theme'); return isValidTheme(t) ? t : 'light'; }
  function saveTheme(t) { try { localStorage.setItem(STORAGE_KEY, t); } catch (e) {} }
  function updateControls(theme) {
    document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
      b.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    });
  }
  function applyTheme(theme, persist) {
    var next = theme === 'dark' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    if (persist) saveTheme(next);
    updateControls(next);
  }
  function sync() { applyTheme(currentTheme(), false); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync); else sync();
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (!t.closest('[data-theme-toggle]')) return;
    e.preventDefault(); e.stopPropagation();
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  }, true);
})();
</script>

    await supabase.auth.signOut();
    dashboard.style.display = 'none';
    loginSection.style.display = 'block';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  });

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getBadge(val) {
    if (!val) return '<span class="badge badge-neutral">-</span>';
    const v = Number(val);
    const cls = v <= 2 ? 'badge-green' : (v >= 4 ? 'badge-red' : 'badge-neutral');
    return `<span class="badge ${cls}">${escapeHtml(v)}</span>`;
  }

  async function showDashboard() {
    loginSection.style.display = 'none';
    dashboard.style.display = 'block';
    tbody.innerHTML = '<tr><td colspan="8" class="admin-empty">در حال دریافت اطلاعات...</td></tr>';

    const { data, error } = await supabase
      .from('survey_responses')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      tbody.innerHTML = `<tr><td colspan="8" class="admin-empty" style="color:#b91c1c;">خطا در دریافت اطلاعات: ${escapeHtml(error.message)}</td></tr>`;
      return;
    }

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="admin-empty">هنوز هیچ نظری ثبت نشده است.</td></tr>';
      return;
    }

    const rows = data.map((row) => {
      const date = row.created_at ? new Date(row.created_at).toLocaleString('fa-IR') : '-';
      const name = row.name ? escapeHtml(row.name) : 'ناشناس';
      const feedback = row.feedback ? escapeHtml(row.feedback) : '-';
      return `<tr>
        <td style="direction: ltr; text-align: right; white-space: nowrap;">${escapeHtml(date)}</td>
        <td>${name}</td>
        <td>${getBadge(row.q1)}</td>
        <td>${getBadge(row.q2)}</td>
        <td>${getBadge(row.q3)}</td>
        <td>${getBadge(row.q4)}</td>
        <td>${getBadge(row.q5)}</td>
        <td style="max-width: 240px; white-space: normal; word-break: break-word;">${feedback}</td>
      </tr>`;
    }).join('');

    tbody.innerHTML = rows;
  }

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) showDashboard();
  }

  checkSession();
});
</script>
